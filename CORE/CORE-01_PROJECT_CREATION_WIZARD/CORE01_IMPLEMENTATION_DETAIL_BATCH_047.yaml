batch: 047
module: CORE-01_PROJECT_CREATION_WIZARD
authority: R9
purpose: "實際施工缺口補齊，不新增功能"

page:
  page_uid: CORE-01
  route: /core/project/create
  status: implementation

wizard:
  total_steps: 10
  steps:
    - STEP_01_PROJECT_BASIC
    - STEP_02_STORY_INPUT
    - STEP_03_CORE_EXTRACTION
    - STEP_04_DNA_PREPARATION
    - STEP_05_BLUEPRINT_CONTAINER
    - STEP_06_PRODUCTION_REQUIREMENT
    - STEP_07_PERMISSION_CHECK
    - STEP_08_REVIEW
    - STEP_09_LOCK_CONFIRM
    - STEP_10_COMPLETED

controls:
  - id: PROJECT_NAME_INPUT
    type: text
    required: true
    action: update_project_basic
  - id: PROJECT_TYPE_SELECTOR
    type: selector
    required: true
    action: set_project_type
  - id: STORY_INPUT_AREA
    type: textarea
    required: true
    action: save_story_input
  - id: BLUEPRINT_BINDING_VIEW
    type: display
    action: bind_blueprint
  - id: DESIGN_LOCK_CONFIRM
    type: confirmation
    action: lock_design

api_contracts:
  - endpoint: POST /api/projects/create
    operation: create_project
    request:
      project_name: string
      project_type: string
      story_input: string
    response:
      project_id: id
      status: state
    errors:
      - validation_failed
      - permission_denied

  - endpoint: POST /api/projects/{id}/lock
    operation: lock_project

 database_mapping:
  entities:
    - Project
    - Blueprint
    - ConversationWorkspace
  relations:
    - Project_to_Blueprint
    - Project_to_Workspace

runtime:
  state_flow:
    - DRAFT
    - STORY_INPUT
    - BLUEPRINT_PENDING
    - REVIEW_PENDING
    - LOCKED
    - READY

permission:
  resource: PROJECT
  actions:
    - CREATE
    - EDIT
    - REVIEW
    - LOCK

qa:
  trace:
    - Page_UID
    - Control_ID
    - Action_ID
    - API
    - Database
    - Runtime
    - Permission
  external_test: pending
