authority: ACPOS_GLOBAL_HOME_UI_RENDER_BINDING
version: V1.2
status: AUTHORITY_ACTIVE
purpose: 1_to_1_global_shell_template_render_binding

binding:
  GLOBAL-SHELL-001:
    template_type: GLOBAL_UI_SHELL
    standalone_page: false
    consumer_page_uid: required
    consumer_page_route: inherited_from_consumer_page_authority
    shell: ACPOS_GLOBAL_UI_SHELL_VISUAL_AUTHORITY_PURPLE_FREEZE
    sections:
      GLOBAL-SEC-HEADER:
        component_id: GLOBAL_HEADER_001
        position:
          x: 0
          y: 0
          width: "100%"
          height: "72px"
        controls:
          - BRAND_LOGO
          - PAGE_CONTEXT_SLOT
          - SEARCH_CONTROL
          - TOP_STATUS
          - NOTIFICATION_CONTROL
          - USER_CONTROL
      GLOBAL-SEC-SIDEBAR:
        component_id: GLOBAL_SIDEBAR_001
        position:
          x: 0
          y: "72px"
          width_expanded: "240px"
          width_collapsed: "72px"
          height: "calc(100%-72px)"
        controls:
          - MENU_ITEM
          - ACTIVE_STATE
          - COLLAPSE_BUTTON
      GLOBAL-SEC-WORKSPACE:
        component_id: GLOBAL_WORKSPACE_001
        position:
          x: "sidebar_width + 20px"
          y: "72px + 20px"
          right: "20px"
          bottom: "20px"
        style:
          padding: "32px"
          radius: "24px"
        controls:
          - CONTENT_SLOT

render_requirements:
  - TemplateContract
  - ConsumerPageUID
  - ConsumerPageContract
  - Section
  - Component
  - Control
  - Action
  - State
  - Position
  - VisualSource
  - Permission
  - I18N

rules:
  shell_template_must_not_create_route: true
  shell_template_must_not_create_page_uid: true
  dashboard_l1_01_remains_home_page: true
  HOME_001_render: reject_render
  unknown_element: reject_render
  unknown_control: reject_render
  unknown_state: reject_render
  missing_header_visual_control: reject_render
  page_content_must_use_CONTENT_SLOT: true
  page_cannot_change_global_geometry: true
