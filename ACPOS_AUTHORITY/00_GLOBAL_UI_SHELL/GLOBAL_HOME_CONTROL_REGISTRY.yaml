authority: ACPOS_GLOBAL_HOME_CONTROL
version: V1.2
status: AUTHORITY_ACTIVE
purpose: Global Home control authority and render binding

controls:
  - id: BRAND_LOGO
    type: BRAND
    component_id: GLOBAL_HEADER_001
    section_id: GLOBAL-SEC-HEADER
    action_id: GLOBAL-ACT-NOOP-BRAND
    permission: PUBLIC_DISPLAY
    states: [DEFAULT]
    validation:
      preserve_ratio: true
      redraw_forbidden: true

  - id: PAGE_CONTEXT_SLOT
    type: CONTEXT_DISPLAY
    component_id: GLOBAL_HEADER_001
    section_id: GLOBAL-SEC-HEADER
    action_id: GLOBAL_CONTEXT_SWITCH
    permission: PAGE_CONTEXT_READ
    states: [EMPTY, READY, LOADING, ERROR]
    data_source: page_specific_authority

  - id: TOP_STATUS
    type: STATUS_DISPLAY
    component_id: GLOBAL_HEADER_001
    section_id: GLOBAL-SEC-HEADER
    action_id: GLOBAL_STATUS_REFRESH
    permission: SYSTEM_STATUS_READ
    states: [DEFAULT, RUNTIME_CONNECTED, WARNING, ERROR]

  - id: USER_CONTROL
    type: USER_MENU
    component_id: GLOBAL_HEADER_001
    section_id: GLOBAL-SEC-HEADER
    action_id: GLOBAL_USER_MENU_OPEN
    permission: USER_SELF_READ
    states: [DEFAULT, ACTIVE, DISABLED]

  - id: MENU_ITEM
    type: NAVIGATION_ITEM
    component_id: GLOBAL_SIDEBAR_001
    section_id: GLOBAL-SEC-SIDEBAR
    action_id: GLOBAL_NAV_OPEN
    permission: NAVIGATION_READ
    states: [DEFAULT, HOVER, ACTIVE, DISABLED]
    data_source: GLOBAL_HOME_NAVIGATION_REGISTRY

  - id: ACTIVE_STATE
    type: NAVIGATION_STATE
    component_id: GLOBAL_SIDEBAR_001
    section_id: GLOBAL-SEC-SIDEBAR
    action_id: GLOBAL_NAV_MARK_ACTIVE
    permission: NAVIGATION_READ
    states: [DEFAULT, ACTIVE]

  - id: COLLAPSE_BUTTON
    type: SIDEBAR_CONTROL
    component_id: GLOBAL_SIDEBAR_001
    section_id: GLOBAL-SEC-SIDEBAR
    action_id: GLOBAL_NAV_COLLAPSE
    permission: NAVIGATION_INTERACT
    states: [DEFAULT, HOVER, ACTIVE, DISABLED]

  - id: CONTENT_SLOT
    type: WORKSPACE_CONTENT_SLOT
    component_id: GLOBAL_WORKSPACE_001
    section_id: GLOBAL-SEC-WORKSPACE
    action_id: GLOBAL_WORKSPACE_RENDER
    permission: PAGE_RENDER
    states: [EMPTY, LOADING, READY, ERROR]

rules:
  - every_control_requires_source_id
  - every_control_requires_component_id
  - every_control_requires_action_id
  - every_control_requires_permission
  - every_control_requires_registered_state
  - no_unknown_control_render
  - pages_cannot_override_global_controls
