authority: ACPOS_GLOBAL_HOME_NAVIGATION
version: V1.1
status: AUTHORITY_ACTIVE
purpose: Define navigation rendering contract for the fixed left sidebar without creating parallel business navigation.

container:
  component_id: GLOBAL_SIDEBAR_001
  orientation: vertical
  expanded_width: "240px"
  collapsed_width: "72px"
  item_height: "52px"
  icon_size: "20px"
  label_size: "16px"

item_contract:
  required_fields:
    - navigation_id
    - page_uid
    - label_i18n_key
    - icon_id
    - route
    - order
    - visibility
    - permission
    - active_match

source_chain:
  navigation_contract:
    source: 00_MASTER/UI_AUTHORITY/NAVIGATION_AUTHORITY.yaml
    role: canonical_navigation_rules
  l1_identity_source:
    source: 00_MASTER/UI_AUTHORITY/L1_PAGE_REGISTRY_v2.yaml
    role: canonical_l1_page_identity
  route_source_primary:
    source: 00_MASTER/PAGE_UID_MASTER_REGISTRY.yaml
    role: canonical_page_route_contract
  route_source_existing_frontend:
    source: 01_FRONTEND/NAVIGATION_REGISTRY.yaml
    role: existing_resolved_routes_only
  permission_source:
    source: page_or_global_permission_authority

canonical_l1_identity:
  - page_uid: L1-01
    page_name: Dashboard
  - page_uid: L1-02
    page_name: AI Workspace
  - page_uid: L1-03
    page_name: Project Topic Task Management
  - page_uid: L1-04
    page_name: Asset Library
  - page_uid: L1-05
    page_name: Video Production
  - page_uid: L1-06
    page_name: Editing
  - page_uid: L1-07
    page_name: Voice
  - page_uid: L1-08
    page_name: QA
  - page_uid: L1-09
    page_name: Admin

route_resolution:
  rules:
    - resolve_by_page_uid_first
    - use_existing_frontend_route_only_when_identity_matches_authority
    - never_guess_missing_route
    - unresolved_route_blocks_item_render
  confirmed_existing_routes:
    L1-01: /dashboard
    L1-02: /workspace
    L1-09: /admin
  unresolved_authority_routes:
    - L1-03
    - L1-04
    - L1-05
    - L1-06
    - L1-07
    - L1-08

items_source:
  type: master_navigation_authority
  policy:
    - never_invent_menu_items
    - never_create_parallel_navigation
    - load_only_authoritative_items
    - hide_items_without_permission
    - block_items_with_unresolved_route

render_behavior:
  expanded: icon_and_label
  collapsed: icon_only
  hover: purple_overlay
  active: purple_gradient_glow
  disabled: muted_with_reason

validation:
  missing_master_navigation_items: BLOCK_MENU_ITEM_RENDER
  unknown_route: REJECT_ITEM
  unresolved_route: REJECT_ITEM
  missing_permission: REJECT_ITEM
  duplicate_navigation_id: REJECT_ITEM
  unknown_page_uid: REJECT_ITEM
