identity_rules:
  global_shell_template_uid: GLOBAL-SHELL-001
  global_shell_is_page: false
  global_shell_owns_route: false
  dashboard_home_page_uid: L1-01
  dashboard_home_route: /dashboard
  HOME_001_page_uid: forbidden

conflict_resolution:
  lower_priority_cannot_override_higher: true
  legacy_HOME_PAGE_REGISTRY: forbidden
  legacy_HOME_COMPONENT_REGISTRY: forbidden
  unknown_parallel_navigation: reject
  second_home_page_definition: reject
  shell_route_definition: reject
  old_r9_visual_values:
    electric_blue_global_primary: superseded_by_purple_visual_authority
    sidebar_expanded_280px: superseded_by_global_shell_240px
    fixed_global_right_panel: superseded_by_page_specific_authority
  page_specific_context:
    owner: page_specific_authority
    global_shell_may_not_invent_context: true

validation_order:
  - master_authority
  - shell_template_contract
  - shell_template_registry
  - consumer_page_contract
  - components
  - controls
  - actions
  - states
  - transitions
  - visual_mapping
  - render_binding

rules:
  - log_conflict
  - reject_unknown_override
  - never_merge_parallel_authorities
  - dashboard_l1_01_is_only_home_page
  - global_shell_is_template_not_page
  - template_contract_validation_precedes_page_ui_render
