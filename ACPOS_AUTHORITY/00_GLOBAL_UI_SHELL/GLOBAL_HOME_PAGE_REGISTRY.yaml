authority: ACPOS_GLOBAL_UI_SHELL_TEMPLATE
version: V1.4
status: AUTHORITY_ACTIVE
purpose: Global UI Shell template authority inherited by ACPOS pages; this template is not a standalone page and must not compete with Dashboard L1-01.

template_identity:
  template_uid: GLOBAL-SHELL-001
  template_type: GLOBAL_UI_SHELL
  standalone_page: false
  owns_page_uid: false
  owns_route: false
  consumer_page_uid_source: 00_MASTER/PAGE_UID_MASTER_REGISTRY.yaml
  consumer_route_source: consuming_page_authority
  dashboard_home_owner:
    page_uid: L1-01
    name: Dashboard
    route: /dashboard

shell:
  canvas: "16:9"
  theme: "Purple Tech Enterprise AI Workspace"
  layout: "Header + Sidebar + Main Workspace"

sections:
  - section_id: GLOBAL-SEC-HEADER
    component_id: GLOBAL_HEADER_001
    fixed: true
  - section_id: GLOBAL-SEC-SIDEBAR
    component_id: GLOBAL_SIDEBAR_001
    fixed: true
  - section_id: GLOBAL-SEC-WORKSPACE
    component_id: GLOBAL_WORKSPACE_001
    fixed_container: true
    replaceable_content: true

header:
  id: GLOBAL_HEADER_001
  height: "72px"
  fixed: true
  areas:
    - brand
    - page_context_slot
    - runtime_status
    - search
    - notification
    - user_control
  context_rule:
    source: page_specific_authority
    global_task_context_forced: false

sidebar:
  id: GLOBAL_SIDEBAR_001
  expanded_width: "240px"
  collapsed_width: "72px"
  position: left
  navigation_mode: vertical
  item_height: "52px"
  navigation_source: GLOBAL_HOME_NAVIGATION_REGISTRY
  rules:
    - no_custom_layout_by_page
    - inherit_global_style
    - no_parallel_navigation

main_workspace:
  id: GLOBAL_WORKSPACE_001
  container: true
  padding: "32px"
  outer_margin: "20px"
  radius: "24px"
  role: page_workspace_container

visual:
  source: ACPOS_GLOBAL_UI_SHELL_VISUAL_AUTHORITY_PURPLE_FREEZE
  background: "#050816"
  panel: "#0C1026"
  primary_glow: "#8B5CFF"
  secondary_glow: "#6E35FF"
  text_primary: "#F3F5FF"
  text_secondary: "#AEB7D9"

template_contract:
  source: GLOBAL_HOME_PAGE_CONTRACT.yaml
  validation_must_precede_render: true
  input:
    - consuming_page_uid
    - current_route
    - authenticated_user_state
    - page_context_payload_when_applicable
    - navigation_authority_payload
  output:
    - rendered_global_shell
    - workspace_content_slot
  dependency:
    - GLOBAL_HOME_PAGE_CONTRACT
    - GLOBAL_HOME_COMPONENT_REGISTRY
    - GLOBAL_HOME_CONTROL_REGISTRY
    - GLOBAL_HOME_CONTROL_ACTION_REGISTRY
    - GLOBAL_HOME_STATE_REGISTRY
    - GLOBAL_HOME_STATE_TRANSITION
    - GLOBAL_HOME_VISUAL_MAPPING
    - GLOBAL_HOME_UI_RENDER_BINDING
    - GLOBAL_HOME_RENDER_VALIDATION
  error_contract:
    missing_consumer_page_uid: BLOCK_RENDER
    missing_authority_source: BLOCK_RENDER
    unknown_component: BLOCK_RENDER
    unknown_control: BLOCK_RENDER
    unknown_state: BLOCK_RENDER
    conflicting_lower_priority_authority: IGNORE_AND_AUDIT

authority_validation:
  source_trace_required: true
  render_requires:
    - template_contract
    - consumer_page_definition
    - section_definition
    - component_definition
    - control_definition
    - action_definition
    - state_definition
    - visual_mapping
    - render_binding

conflict_resolution:
  priority_source: GLOBAL_HOME_AUTHORITY_PRIORITY
  rule:
    - dashboard_l1_01_is_only_home_page
    - global_shell_is_template_not_page
    - do_not_override_global_shell
    - do_not_merge_unknown_components
    - do_not_use_legacy_HOME_registry

restriction:
  - do_not_create_HOME_001_page
  - do_not_assign_route_to_global_shell_template
  - do_not_change_header
  - do_not_change_sidebar
  - do_not_change_logo_ratio
  - pages_only_modify_main_workspace_content
