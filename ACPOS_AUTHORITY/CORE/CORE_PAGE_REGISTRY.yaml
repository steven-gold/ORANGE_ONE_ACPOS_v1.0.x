    page_uid: mapped
    surface: mapped
    navigation_l1_l6: mapped_by_authority_source
    route: mapped
    visibility: mapped
    layout: mapped
    sections: mapped
    components: mapped
    fields: mapped_by_source
    actions: mapped_by_source
    api_binding: mapped_by_source
    database_binding: mapped_by_source
    permission_binding: mapped_by_source
    runtime_events: mapped_by_source
    qa_evidence: mapped_by_source
  missing_required_source: BLOCK_CONSTRUCTION
  invented_missing_navigation_level: REJECT

rules:
  - no_parallel_core_page
