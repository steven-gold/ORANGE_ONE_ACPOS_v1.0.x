  fields_source: CORE_DATA_BINDING_AUTHORITY.yaml
  actions_source: CORE_ACTION_REGISTRY.yaml
  controls_source: CORE_CONTROL_REGISTRY.yaml
  control_visibility_source: CORE_CONTROL_VISIBILITY_RULE.yaml
  api_binding_source: CORE_DATA_API_BINDING.yaml
  api_master_source: 00_MASTER/API_MASTER_REGISTRY.yaml
  database_binding_source: CORE_DATABASE_BINDING.yaml
  database_master_source: 00_MASTER/DATABASE_MASTER_SCHEMA.yaml
  permission_binding_source: CORE_PERMISSION_MATRIX.yaml
  runtime_events_source: CORE_RUNTIME_PERMISSION_QA.yaml
  qa_evidence_source: CORE_QA_EVIDENCE.yaml
  visual_mapping_source: CORE_VISUAL_MAPPING.yaml
  render_binding_source: CORE_UI_RENDER_BINDING.yaml
  render_validation_source: CORE_FINAL_RENDER_VALIDATION.yaml
  i18n_source: CORE_I18N.yaml
  ai_core_source: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CORE_AUTHORITY_REGISTRY.yaml
  ai_conversation_interface_source: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CONVERSATION_INTERFACE_AUTHORITY.yaml
