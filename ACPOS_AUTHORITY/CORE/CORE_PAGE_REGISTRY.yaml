    active_render: false
  CORE-04:
    status: REPLACED_AS_SEPARATE_PAGE
    active_render: false
  CORE-05:
    status: REPLACED_AS_SEPARATE_PAGE
    active_render: false
  CORE-06:
    status: REPLACED_AS_SEPARATE_PAGE
