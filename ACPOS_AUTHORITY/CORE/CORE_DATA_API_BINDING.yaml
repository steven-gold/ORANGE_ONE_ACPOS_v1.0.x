version: CORE-DATA-API-BINDING-V1
status: AUTHORITY_ACTIVE_WITH_RESOLUTION_GATES
purpose: Bind CORE controls/actions to authoritative backend API definitions. This file must not invent endpoints that are not present in the master API registry.

source_authorities:
  - 00_MASTER/API_MASTER_REGISTRY.yaml
  - 02_BACKEND/API_ENTITY_CORE_BATCH_008.yaml

bindings:
  CORE-ACT-CREATE-PROJECT:
    authoritative_action_key: project_create
    endpoint_resolution: REQUIRED_FROM_API_MASTER
  CORE-ACT-CREATE-TOPIC:
    authoritative_action_key: topic_create
    endpoint_resolution: REQUIRED_FROM_API_MASTER
  CORE-ACT-SELECT-PROJECT:
    endpoint_resolution: REQUIRED_FROM_API_MASTER
  CORE-ACT-SELECT-TOPIC:
    endpoint_resolution: REQUIRED_FROM_API_MASTER
  CORE-ACT-OPEN-WORK-ITEM:
    endpoint_resolution: REQUIRED_FROM_API_MASTER
  CORE-ACT-CREATE-CONVERSATION-THREAD:
    endpoint_resolution: REQUIRED_FROM_API_MASTER
  CORE-ACT-CONFIRM-DNA:
    endpoint_resolution: REQUIRED_FROM_API_MASTER
  CORE-ACT-GENERATE-BLUEPRINT:
    endpoint_resolution: REQUIRED_FROM_API_MASTER
  CORE-ACT-LOCK-BLUEPRINT:
    endpoint_resolution: REQUIRED_FROM_API_MASTER
  CORE-ACT-GENERATE-SCRIPT:
    endpoint_resolution: REQUIRED_FROM_API_MASTER
  CORE-ACT-CONFIRM-SCRIPT:
    endpoint_resolution: REQUIRED_FROM_API_MASTER
  CORE-ACT-CONFIRM-CORE:
    endpoint_resolution: REQUIRED_FROM_API_MASTER
  CORE-ACT-CREATE-PRODUCTION-TASK:
    endpoint_resolution: REQUIRED_FROM_API_MASTER

required_api_contract_fields:
  - api_id
  - endpoint
  - method
  - request_schema
  - response_schema
  - error_contract
  - authentication
  - permission
  - database_relation
  - runtime_event
  - qa_evidence

rules:
  - do_not_invent_endpoint
  - do_not_mark_api_bound_until_master_api_entry_resolved
  - design_render_does_not_require_live_api
  - production_runtime_requires_resolved_api
  - unresolved_api_blocks_final_runtime_freeze
