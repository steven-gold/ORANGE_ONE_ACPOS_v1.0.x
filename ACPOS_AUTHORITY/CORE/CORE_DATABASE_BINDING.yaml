version: CORE-DATABASE-BINDING-V1
status: AUTHORITY_ACTIVE_WITH_RESOLUTION_GATES
purpose: Bind CORE page data entities to authoritative database schema without inventing tables or columns.

source_authorities:
  - 00_MASTER/DATABASE_MASTER_SCHEMA.yaml
  - 00_MASTER/DATABASE_TABLE_COLUMN_REGISTRY.md
  - 00_MASTER/DB_MIGRATION_INDEX.md

entities:
  project:
    required_fields: [project_id]
    table_resolution: REQUIRED_FROM_DATABASE_MASTER
  topic:
    required_fields: [topic_id, project_id]
    table_resolution: REQUIRED_FROM_DATABASE_MASTER
  core_work_item:
    required_fields: [work_item_id, project_id, topic_id, status, version_id]
    table_resolution: REQUIRED_FROM_DATABASE_MASTER
  conversation_thread:
    required_fields: [conversation_thread_id, work_item_id]
    table_resolution: REQUIRED_FROM_DATABASE_MASTER
  dna_version:
    required_fields: [version_id, status]
    table_resolution: REQUIRED_FROM_DATABASE_MASTER
  blueprint_version:
    required_fields: [version_id, status]
    table_resolution: REQUIRED_FROM_DATABASE_MASTER
  script_version:
    required_fields: [version_id, status]
    table_resolution: REQUIRED_FROM_DATABASE_MASTER
  decision_record:
    required_fields: [decision_id, version_id, status]
    table_resolution: REQUIRED_FROM_DATABASE_MASTER
  production_task:
    required_fields: [production_task_id, project_id, topic_id]
    table_resolution: REQUIRED_FROM_DATABASE_MASTER
    core_context_binding: forbidden

rules:
  - do_not_invent_table
  - do_not_invent_column
  - existing_version_must_not_be_overwritten
  - unresolved_database_binding_blocks_final_runtime_freeze
  - design_render_does_not_require_live_database
