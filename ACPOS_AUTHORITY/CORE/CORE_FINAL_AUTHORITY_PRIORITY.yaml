version: CORE-FINAL-AUTHORITY-PRIORITY-V2.2
status: AUTHORITY_ACTIVE
purpose: Define final authority priority for CORE rendering and prevent conflicting definitions.

priority_order:
  - level: 1
    source: 00_MASTER/ACPOS_AI_SEQUENCED_SINGLE_AUTHORITY_CONSTRUCTION_PACKAGE/ACPOS_SINGLE_AUTHORITY_CONSTRUCTION_MASTER_AI_SEQUENCED_FINAL.yaml
    responsibility:
      - Single Construction Authority
      - No Parallel Specification
  - level: 2
    source: ACPOS_AUTHORITY/00_GLOBAL_UI_SHELL/GLOBAL_HOME_AUTHORITY_PRIORITY.yaml
    responsibility:
      - Global Shell Template
      - Header
      - Sidebar
      - Brand
      - Global Visual Rules
  - level: 3
    source: 00_MASTER/PAGE_UID_MASTER_REGISTRY.yaml
    responsibility:
      - CORE-01 Page UID Master Record
      - Legacy CORE Page Replacement Mapping
  - level: 4
    source: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CORE_AUTHORITY_REGISTRY.yaml
    responsibility:
      - AI Conversation Core Modules
      - Context Memory Decision Version Provider Runtime Permission Audit
  - level: 5
    source: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CONVERSATION_INTERFACE_AUTHORITY.yaml
    responsibility:
      - Shared Single AI and Multi AI Interface
      - Assistant
      - Runtime Status
      - Score
      - Human Decision Flow
      - Input At Parser
      - Reply Context Menu
      - Provider Brand Display
  - level: 6
    source: docs/authority/CORE_AI_CONVERSATION/visual/CORE_AI_CONVERSATION_VISUAL_DESIGN_AUTHORITY.yaml
    responsibility:
      - CORE Unit Conversation Visual Extension
      - CORE Context Binding
      - CORE Script and Decision Application
  - level: 7
    source: CORE_VISUAL_AND_WORKSPACE_AUTHORITY_FINAL.md
    responsibility:
      - Latest CORE single-page architecture
      - Work Item / Conversation model
      - Production Task boundary
  - level: 8
    source: CORE_PAGE_REGISTRY.yaml
    responsibility:
      - Page Identity
      - Active Page Scope
      - Page Master Closure
      - Section Registry
  - level: 9
    source: CORE_SCREEN_LAYOUT.yaml
    responsibility:
      - Region Layout
      - Component Position
      - Size Relationship
  - level: 10
    source: CORE_COMPONENT_REGISTRY.yaml
    responsibility:
      - Component Definition
      - Shared AI Subcomponent Requirement
      - Component Binding
  - level: 11
    source: CORE_WORK_ITEM_CONVERSATION_REGISTRY.yaml
    responsibility:
      - Work Item Navigation
      - Conversation Thread Isolation
  - level: 12
    source: CORE_CONTROL_REGISTRY.yaml
    responsibility:
      - Control Definition
      - Action Binding
  - level: 13
    source: CORE_ACTION_REGISTRY.yaml
    responsibility:
      - Action Flow
      - Handoff Trigger
  - level: 14
    source: CORE_STATE_REGISTRY.yaml
    responsibility:
      - State Definition
  - level: 15
    source: CORE_STATE_TRANSITION.yaml
    responsibility:
      - State Transition
  - level: 16
    source: CORE_VISUAL_MAPPING.yaml
    responsibility:
      - UI Element Source Trace
  - level: 17
    source: CORE_UI_RENDER_BINDING.yaml
    responsibility:
      - Final Render Mapping

conversation_architecture:
  ai_core_inheritance: required
  shared_ai_conversation_interface_inheritance: required
  core_ai_conversation_visual_extension_inheritance: required
  project_binding: required
  topic_binding: required
  work_item_binding: required
  conversation_thread_binding: required
  production_task_binding: forbidden
  modes:
    - SINGLE_AI
    - MULTI_AI
  assistant_is_third_mode: forbidden

core_process_dependency:
  - Story_Chapter_World_Context
  - DNA
  - Blueprint
  - Script
  - Version
  - Decision

production_handoff:
  requires:
    - project_locked
    - topic_locked
    - downstream_script_ready
  result:
    - Production_Task
    - ASSET_Notification

conflict_resolution:
  - lower_priority_cannot_override_higher
  - CORE-02_to_CORE-06_active_legacy_page_render_forbidden
  - blueprint_lock_next_dna_definition_forbidden
  - task_context_and_production_task_context_must_not_be_confused
  - generic_chat_render_forbidden_when_shared_ai_interface_authority_exists
  - assistant_as_third_mode_forbidden
  - ai_fusion_before_human_decision_forbidden

render_rule:
  unknown_component: reject
  unknown_control: reject
  unknown_state: reject
  unbound_visual_element: reject
  missing_work_item_navigation: reject
  missing_page_uid_master_record: reject
  missing_ai_core_inheritance: reject
  missing_shared_ai_conversation_interface_inheritance: reject
  missing_core_ai_conversation_visual_extension_inheritance: reject
  missing_assistant_runtime_score_or_decision_flow: reject
