version: CORE-PAGE-CONTRACT-V1.1
status: AUTHORITY_ACTIVE
page_uid: CORE-01

input:
  required:
    - authenticated_user
  page_context:
    - project_id
    - topic_id
  work_item_context:
    - work_item_id
    - conversation_thread_id
  optional:
    - version_id
    - selected_reference_ids

output:
  - updated_project_or_topic_core_content
  - locked_work_item_versions
  - confirmed_script_version
  - decision_record
  - production_task_request_after_core_lock

dependencies:
  - docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CORE_AUTHORITY_REGISTRY.yaml
  - docs/authority/CORE_AI_CONVERSATION/visual/CORE_AI_CONVERSATION_VISUAL_DESIGN_AUTHORITY.yaml
  - CORE_COMPONENT_REGISTRY
  - CORE_WORK_ITEM_CONVERSATION_REGISTRY
  - CORE_CONTROL_REGISTRY
  - CORE_ACTION_REGISTRY
  - CORE_STATE_REGISTRY
  - CORE_STATE_TRANSITION
  - CORE_DATA_BINDING_AUTHORITY
  - CORE_PERMISSION_MATRIX
  - CORE_RUNTIME_PERMISSION_QA
  - CORE_VISUAL_MAPPING
  - CORE_UI_RENDER_BINDING
  - CORE_I18N

ai_conversation_contract:
  inherit_ai_core: required
  inherit_ai_conversation_visual_authority: required
  generic_chat_only_layout: forbidden
  required_bindings:
    - project_id
    - topic_id
    - work_item_id
    - conversation_thread_id

api_binding:
  source: 00_MASTER/API_MASTER_REGISTRY.yaml
  rule:
    - resolve_existing_authoritative_api_only
    - do_not_invent_endpoint_in_page_contract
    - block_backend_binding_if_authoritative_api_missing

database_binding:
  source: 00_MASTER/DATABASE_MASTER_SCHEMA.yaml
  rule:
    - resolve_existing_authoritative_table_only
    - do_not_invent_table_in_page_contract

error_contract:
  missing_project_context: BLOCK_CONTEXT_LOAD
  missing_topic_context: BLOCK_WORK_ITEM_LOAD
  missing_work_item: BLOCK_CONVERSATION_LOAD
  missing_conversation_thread: BLOCK_CONVERSATION_LOAD
  missing_ai_core_authority: BLOCK_CONVERSATION_RENDER
  missing_ai_conversation_visual_authority: BLOCK_CONVERSATION_RENDER
  cross_work_item_history_mix: REJECT_DATA
  production_task_used_as_core_context: REJECT_DATA
  authority_conflict: BLOCK_RENDER_AND_AUDIT

previous_flow:
  - GLOBAL_UI_SHELL_READY
next_flow:
  - CORE_WORK_ITEM_CONTINUE
  - CORE_SCOPE_LOCK
  - PRODUCTION_TASK_CREATE_ONLY_AFTER_LOCK
