version: CORE-CONTROL-VISIBILITY-RULE-V2
status: AUTHORITY_ACTIVE
rules:
  CORE-CTRL-PROJECT-SELECTOR:
    visible: true
    enabled_when: user_has_CORE_PROJECT_READ

  CORE-CTRL-CREATE-PROJECT:
    visible: true
    enabled_when: user_has_CORE_PROJECT_CREATE

  CORE-CTRL-TOPIC-SELECTOR:
    visible: true
    enabled_when:
      - project_context_state_in: [READY, LOCKED]
      - user_has_CORE_TOPIC_READ

  CORE-CTRL-CREATE-TOPIC:
    visible: true
    enabled_when:
      - project_context_state_in: [READY, LOCKED]
      - user_has_CORE_TOPIC_CREATE

  CORE-CTRL-WORK-ITEM-SELECT:
    visible_when:
      - project_id_present
      - topic_id_present
    enabled_when: user_has_CORE_WORK_ITEM_READ

  CORE-CTRL-NEW-THREAD:
    visible_when:
      - work_item_id_present
    enabled_when: user_has_CORE_CONVERSATION_CREATE

  CORE-CTRL-CONFIRM-DNA:
    visible_when:
      - dna_state: REVIEW
    enabled_when: user_has_CORE_DNA_CONFIRM

  CORE-CTRL-GENERATE-BLUEPRINT:
    visible_when:
      - dna_state_in: [LOCKED]
    enabled_when: user_has_CORE_BLUEPRINT_GENERATE

  CORE-CTRL-LOCK-BLUEPRINT:
    visible_when:
      - blueprint_state: REVIEW
    enabled_when: user_has_CORE_BLUEPRINT_LOCK

  CORE-CTRL-GENERATE-SCRIPT:
    visible_when:
      - blueprint_state: LOCKED
    enabled_when: user_has_CORE_SCRIPT_GENERATE

  CORE-CTRL-CONFIRM-SCRIPT:
    visible_when:
      - script_state: REVIEW
    enabled_when: user_has_CORE_SCRIPT_CONFIRM

  CORE-CTRL-CONFIRM-CORE:
    visible_when:
      - core_scope_state: READY_TO_LOCK
    enabled_when: user_has_CORE_DECISION_CONFIRM

  CORE-CTRL-CREATE-PRODUCTION-TASK:
    visible_when:
      - core_scope_state: LOCKED
      - project_context_state: LOCKED
      - topic_context_state: LOCKED
      - script_state: CONFIRMED
    enabled_when: user_has_CORE_HANDOFF_CREATE

forbidden:
  - undefined_control
  - undefined_action
  - undefined_state_reference
  - generated_ui_only
  - production_task_selector_inside_CORE_page_context
