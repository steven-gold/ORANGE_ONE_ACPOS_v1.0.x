version: CORE-UI-RENDER-BINDING-V2.2
status: AUTHORITY_ACTIVE
purpose: 1_to_1_authority_render_mapping
rules:
  source_required: true
  unknown_component: reject_render
  unknown_control: reject_render
  unknown_state: reject_render
  unknown_position: reject_render
  page_content_outside_global_workspace: reject_render
  generic_chat_layout: reject_render

ai_core_inheritance:
  module_authority: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CORE_AUTHORITY_REGISTRY.yaml
  foundation_authority: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CORE_FOUNDATION_AUTHORITY.md
  shared_interface_authority: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CONVERSATION_INTERFACE_AUTHORITY.yaml
  core_conversation_visual_extension: docs/authority/CORE_AI_CONVERSATION/visual/CORE_AI_CONVERSATION_VISUAL_DESIGN_AUTHORITY.yaml
  required_modules:
    - Conversation
    - Context
    - Memory
    - Decision
    - Version
    - Notebook_Record
    - Provider
    - Runtime_State
    - Permission
    - Audit
  required_conversation_features:
    - SINGLE_AI
    - MULTI_AI
    - ASSISTANT
    - ASSISTANT_RECORD
    - RUNTIME_STATUS
    - SCORE_PANEL
    - HUMAN_DECISION_PANEL
    - INPUT_AT_PARSER
    - REPLY_RIGHT_CLICK_MENU
    - PROVIDER_BRAND_DISPLAY
  render_contract:
    ai_conversation_main_area: required
    single_ai_mode: required
    multi_ai_mode: required
    assistant_present_in_both_modes: required
    runtime_status_near_active_response: required
    score_after_summary_before_human_decision: required
    human_decision_before_assistant_structured_final_draft: required
    right_click_reply_operations: required
    at_parser_not_button: required
    provider_brand_only_in_chat: required
    normal_chat_only_layout: forbidden

mapping:
  CORE-01:
    shell_template: GLOBAL-SHELL-001
    shell: ACPOS_GLOBAL_UI_SHELL_VISUAL_AUTHORITY_PURPLE_FREEZE
    global_inheritance:
      header: GLOBAL_HEADER_001
      sidebar: GLOBAL_SIDEBAR_001
      workspace: GLOBAL_WORKSPACE_001
    page_context_bar:
      section_id: CORE-SEC-PAGE-CONTEXT
      component_id: CORE-COMP-PAGE-CONTEXT
      position:
        x: 0
        y: 0
        width: "100%"
        height: "64px"
      controls:
        - CORE-CTRL-PROJECT-SELECTOR
        - CORE-CTRL-CREATE-PROJECT
        - CORE-CTRL-TOPIC-SELECTOR
        - CORE-CTRL-CREATE-TOPIC
    body:
      y: "80px"
      height: "calc(100%-80px)"
      columns:
        left:
          width: "22%"
          component_id: CORE-COMP-WORK-ITEM-NAV
          section_id: CORE-SEC-WORK-ITEM-NAV
          controls:
            - CORE-CTRL-WORK-ITEM-SELECT
            - CORE-CTRL-NEW-THREAD
        center:
          width: "50%"
          component_id: CORE-COMP-CONVERSATION
          section_id: CORE-SEC-CONVERSATION
          controls:
            - CORE-CTRL-CONVERSATION-INPUT
          primary: true
          ai_core_binding:
            inherit: required
            shared_interface: AI_CONVERSATION_INTERFACE_AUTHORITY
            core_visual_extension: CORE_AI_CONVERSATION_VISUAL_DESIGN_AUTHORITY
            required_bindings:
              - Project_ID
              - Topic_ID
              - Work_Item_ID
              - Conversation_Thread_ID
              - Context_ID
              - Version_ID
            forbidden_bindings:
              - Production_Task_ID
            required_subcomponents:
              - AICORE-COMP-MODE-SELECTOR
              - AICORE-COMP-SINGLE-AI-WORKSPACE
              - AICORE-COMP-MULTI-AI-WORKSPACE
              - AICORE-COMP-MESSAGE-WORKSPACE
              - AICORE-COMP-RUNTIME-STATUS
              - AICORE-COMP-ASSISTANT
              - AICORE-COMP-ASSISTANT-RECORD
              - AICORE-COMP-SCORE-PANEL
              - AICORE-COMP-DECISION-PANEL
              - AICORE-COMP-INPUT-COMPOSER
              - AICORE-COMP-REPLY-CONTEXT-MENU
        right:
          width: "28%"
          rail:
            - order: 1
              component_id: CORE-COMP-DNA
              section_id: CORE-SEC-DNA
              controls: [CORE-CTRL-CONFIRM-DNA]
            - order: 2
              component_id: CORE-COMP-BLUEPRINT
              section_id: CORE-SEC-BLUEPRINT
              controls: [CORE-CTRL-GENERATE-BLUEPRINT, CORE-CTRL-LOCK-BLUEPRINT]
            - order: 3
              component_id: CORE-COMP-SCRIPT
              section_id: CORE-SEC-SCRIPT
              controls: [CORE-CTRL-GENERATE-SCRIPT, CORE-CTRL-CONFIRM-SCRIPT]
            - order: 4
              component_id: CORE-COMP-VERSION
              section_id: CORE-SEC-VERSION
            - order: 5
              component_id: CORE-COMP-DECISION
              section_id: CORE-SEC-DECISION
              controls: [CORE-CTRL-CONFIRM-CORE, CORE-CTRL-CREATE-PRODUCTION-TASK]

binding_flow:
  PageUIDMasterRecord: required
  Page: required
  Section: required
  Component: required
  Control: required
  Action: required
  State: required
  Position: required
  VisualSource: required
  AICoreAuthority: required
  AIConversationSharedInterfaceAuthority: required
  COREAIConversationVisualExtension: required

context_rules:
  project_selector: required
  topic_selector: required
  work_item_selector: required
  production_task_context: forbidden
  page_context_controls_inside_conversation: forbidden

final_rule:
  render_must_include_work_item_rail: true
  render_must_not_replace_global_shell: true
  render_must_inherit_ai_core: true
  render_must_inherit_shared_ai_conversation_interface: true
  render_must_inherit_core_ai_conversation_visual_extension: true
  render_must_not_omit_assistant_score_runtime_or_decision_flow: true
