version: CORE-FINAL-RENDER-VALIDATION-V2.3
status: AUTHORITY_ACTIVE
purpose: validate_ui_can_be_rendered_from_authority

checklist:
  global_shell_authority: required
  global_shell_render_binding: required
  ai_core_authority_registry: required
  ai_conversation_visual_authority: required
  page_registry: required
  page_contract: required
  screen_layout: required
  component_registry: required
  component_position_map: required
  work_item_conversation_registry: required
  control_registry: required
  control_visibility_rule: required
  action_registry: required
  state_registry: required
  state_transition: required
  data_binding_authority: required
  data_api_binding: required
  database_binding: required
  permission_matrix: required
  runtime_binding: required
  visual_mapping: required
  ui_render_binding: required
  authority_priority: required
  i18n: required
  qa_evidence: required

required_external_authority_sources:
  ai_core_authority_registry: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CORE_AUTHORITY_REGISTRY.yaml
  ai_conversation_visual_authority: docs/authority/CORE_AI_CONVERSATION/visual/CORE_AI_CONVERSATION_VISUAL_DESIGN_AUTHORITY.yaml

render_rule:
  every_element_requires_source: true
  every_control_requires_action: true
  every_control_requires_registered_state: true
  every_control_requires_permission: true
  every_static_control_label_requires_i18n_key: true
  ai_core_inheritance_required: true
  ai_conversation_visual_inheritance_required: true
  generic_chat_render: reject
  ai_free_design_element: reject
  legacy_CORE_02_active_page: reject
  global_shell_replacement: reject
  production_task_context_in_CORE: reject
  missing_project_selector: reject
  missing_topic_selector: reject
  missing_work_item_navigation: reject
  missing_thread_binding: reject
  cross_work_item_history_mix: reject
  right_rail_wrong_dependency_order: reject
  ai_generated_right_rail_geometry: reject
  missing_version_state_transition: reject
  missing_decision_state_transition: reject

expected_layout:
  page_context_bar: required
  left_work_item_rail:
    width: "22%"
    required: true
  center_conversation:
    width: "50%"
    required: true
    primary: true
  right_state_rail:
    width: "28%"
    required_order:
      - DNA
      - Blueprint
      - Script
      - Version
      - Decision
    exact_geometry_source: unresolved_authority_required

validation_modes:
  design_reference_render:
    requires_live_api: false
    requires_live_database: false
    requires_all_ui_authority_contracts: true
    allows_mock_content_only_when_clearly_marked_design_sample: true
    allows_non_pixel_exact_right_rail_when_marked_unresolved: true
  pixel_exact_design_render:
    requires_resolved_right_rail_geometry_authority: true
    unresolved_geometry: block
  production_runtime:
    requires_resolved_api_binding: true
    requires_resolved_database_binding: true
    requires_real_permission_runtime: true
    requires_test_evidence: true

status_gate:
  authority_contract_complete_when_all_required_files_present: true
  visual_reference_generation_allowed_after_contract_validation: true
  pixel_exact_render_requires_resolved_right_rail_geometry: true
  final_frozen_requires_resolved_live_bindings: true
  final_frozen_requires_real_render_snapshot_and_test_evidence: true
  do_not_claim_final_frozen_before_real_test: true
