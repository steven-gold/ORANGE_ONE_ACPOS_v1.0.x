version: CORE-FINAL-RENDER-VALIDATION-V2.5
status: AUTHORITY_ACTIVE
purpose: validate_ui_can_be_rendered_from_authority

checklist:
  global_shell_authority: required
  global_shell_template_contract: required
  global_shell_render_binding: required
  page_uid_master_record: required
  frontend_page_registry_alignment: required
  frontend_page_uid_mapping_alignment: required
  frontend_core_page_mapping_alignment: required
  frontend_core_entity_mapping_alignment: required
  frontend_core_section_mapping_alignment: required
  frontend_core_control_mapping_alignment: required
  ai_core_authority_registry: required
  ai_conversation_shared_interface_authority: required
  core_ai_conversation_visual_extension: required
  page_registry: required
  page_contract: required
  screen_layout: required
  component_registry: required
  component_position_map: required
  work_item_conversation_registry: required
  control_registry: required
  control_visibility_rule: required
  action_registry: required
  state_registry: required
  state_transition: required
  data_binding_authority: required
  data_api_binding: required
  database_binding: required
  permission_matrix: required
  runtime_binding: required
  visual_mapping: required
  ui_render_binding: required
  authority_priority: required
  i18n: required
  qa_evidence: required

required_external_authority_sources:
  global_shell_template: ACPOS_AUTHORITY/00_GLOBAL_UI_SHELL/GLOBAL_HOME_PAGE_REGISTRY.yaml
  page_uid_master_record: 00_MASTER/PAGE_UID_MASTER_REGISTRY.yaml
  frontend_page_registry: 01_FRONTEND/PAGE_REGISTRY.yaml
  frontend_page_uid_mapping: 01_FRONTEND/PAGE_UID_MAPPING.yaml
  frontend_core_page_mapping: 01_FRONTEND/CORE_PAGE_MAPPING.yaml
  frontend_core_entity_mapping: 01_FRONTEND/CORE_PAGE_ENTITY_MAPPING.yaml
  frontend_core_section_mapping: 01_FRONTEND/CORE_SECTION_MAPPING.yaml
  frontend_core_control_mapping: 01_FRONTEND/CORE_CONTROL_MAPPING.yaml
  ai_core_authority_registry: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CORE_AUTHORITY_REGISTRY.yaml
  ai_conversation_shared_interface_authority: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CONVERSATION_INTERFACE_AUTHORITY.yaml
  core_ai_conversation_visual_extension: docs/authority/CORE_AI_CONVERSATION/visual/CORE_AI_CONVERSATION_VISUAL_DESIGN_AUTHORITY.yaml

render_rule:
  every_element_requires_source: true
  every_control_requires_action: true
  every_control_requires_registered_state: true
  every_control_requires_permission: true
  every_static_control_label_requires_i18n_key: true
  page_uid_master_record_required: true
  frontend_mapping_must_delegate_to_current_authority: true
  frontend_parallel_page_registry: reject
  frontend_legacy_split_page_active_mapping: reject
  global_shell_must_be_template_not_page: true
  dashboard_l1_01_remains_home_page: true
  ai_core_inheritance_required: true
  shared_ai_conversation_interface_inheritance_required: true
  core_ai_conversation_visual_extension_inheritance_required: true
  only_single_ai_and_multi_ai_modes: true
  assistant_present_in_both_modes: true
  assistant_as_third_mode: reject
  runtime_status_near_active_response: required
  score_after_summary_before_human_decision: required
  human_decision_before_assistant_structured_final_draft: required
  input_at_parser_not_button: required
  reply_operations_right_click_only: required
  provider_brand_only_in_chat: required
  generic_chat_render: reject
  ai_free_design_element: reject
  legacy_CORE_02_to_CORE_06_active_page: reject
  global_shell_replacement: reject
  HOME_001_page_render: reject
  production_task_context_in_CORE: reject
  missing_project_selector: reject
  missing_topic_selector: reject
  missing_work_item_navigation: reject
  missing_thread_binding: reject
  cross_work_item_history_mix: reject
  right_rail_wrong_dependency_order: reject
  ai_generated_right_rail_geometry: reject
  missing_version_state_transition: reject
  missing_decision_state_transition: reject
  missing_assistant_component: reject
  missing_runtime_status_component: reject
  missing_score_panel: reject
  missing_human_decision_flow: reject
  missing_reply_context_menu: reject

expected_layout:
  shell_template:
    uid: GLOBAL-SHELL-001
    standalone_page: false
  page_context_bar: required
  left_work_item_rail:
    width: "22%"
    required: true
  center_conversation:
    width: "50%"
    required: true
    primary: true
    required_internal_features:
      - SINGLE_AI
      - MULTI_AI
      - ASSISTANT
      - ASSISTANT_RECORD
      - RUNTIME_STATUS
      - SCORE_PANEL
      - HUMAN_DECISION_PANEL
      - INPUT_AT_PARSER
      - REPLY_RIGHT_CLICK_MENU
      - PROVIDER_BRAND_DISPLAY
  right_state_rail:
    width: "28%"
    required_order:
      - DNA
      - Blueprint
      - Script
      - Version
      - Decision
    exact_geometry_source: unresolved_authority_required

validation_modes:
  design_reference_render:
    requires_live_api: false
    requires_live_database: false
    requires_all_ui_authority_contracts: true
    allows_mock_content_only_when_clearly_marked_design_sample: true
    allows_non_pixel_exact_right_rail_when_marked_unresolved: true
  pixel_exact_design_render:
    requires_resolved_right_rail_geometry_authority: true
    unresolved_geometry: block
  production_runtime:
    requires_resolved_api_binding: true
    requires_resolved_database_binding: true
    requires_real_permission_runtime: true
    requires_test_evidence: true

status_gate:
  authority_contract_complete_when_all_required_files_present: true
  frontend_alignment_required_before_visual_reference_generation: true
  visual_reference_generation_allowed_after_contract_validation: true
  pixel_exact_render_requires_resolved_right_rail_geometry: true
  final_frozen_requires_resolved_live_bindings: true
  final_frozen_requires_real_render_snapshot_and_test_evidence: true
  do_not_claim_final_frozen_before_real_test: true
