version: CORE-VISUAL-MAPPING-V2.1
status: AUTHORITY_ACTIVE
visual_mapping:
  rule: every_ui_element_requires_authority_source
  mappings:
    global_header:
      source: ACPOS_AUTHORITY/00_GLOBAL_UI_SHELL/ACPOS_GLOBAL_UI_SHELL_VISUAL_AUTHORITY_PURPLE_FREEZE.md
      component_id: GLOBAL_HEADER_001
    global_sidebar:
      source: ACPOS_AUTHORITY/00_GLOBAL_UI_SHELL/GLOBAL_HOME_COMPONENT_REGISTRY.yaml
      component_id: GLOBAL_SIDEBAR_001
    page_context_bar:
      source: CORE_COMPONENT_REGISTRY.yaml
      component_id: CORE-COMP-PAGE-CONTEXT
      section_id: CORE-SEC-PAGE-CONTEXT
      controls:
        - CORE-CTRL-PROJECT-SELECTOR
        - CORE-CTRL-CREATE-PROJECT
        - CORE-CTRL-TOPIC-SELECTOR
        - CORE-CTRL-CREATE-TOPIC
    work_item_navigation:
      source: CORE_WORK_ITEM_CONVERSATION_REGISTRY.yaml
      component_id: CORE-COMP-WORK-ITEM-NAV
      section_id: CORE-SEC-WORK-ITEM-NAV
      controls:
        - CORE-CTRL-WORK-ITEM-SELECT
        - CORE-CTRL-NEW-THREAD
    conversation_workspace:
      component_id: CORE-COMP-CONVERSATION
      section_id: CORE-SEC-CONVERSATION
      component_source: CORE_COMPONENT_REGISTRY.yaml
      ai_core_source: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CORE_AUTHORITY_REGISTRY.yaml
      shared_interface_source: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CONVERSATION_INTERFACE_AUTHORITY.yaml
      core_visual_extension_source: docs/authority/CORE_AI_CONVERSATION/visual/CORE_AI_CONVERSATION_VISUAL_DESIGN_AUTHORITY.yaml
      controls:
        - CORE-CTRL-CONVERSATION-INPUT
      required_shared_visual_subcomponents:
        - AICORE-COMP-MODE-SELECTOR
        - AICORE-COMP-SINGLE-AI-WORKSPACE
        - AICORE-COMP-MULTI-AI-WORKSPACE
        - AICORE-COMP-MESSAGE-WORKSPACE
        - AICORE-COMP-RUNTIME-STATUS
        - AICORE-COMP-ASSISTANT
        - AICORE-COMP-ASSISTANT-RECORD
        - AICORE-COMP-SCORE-PANEL
        - AICORE-COMP-DECISION-PANEL
        - AICORE-COMP-INPUT-COMPOSER
        - AICORE-COMP-REPLY-CONTEXT-MENU
    dna_panel:
      source: CORE_COMPONENT_REGISTRY.yaml
      component_id: CORE-COMP-DNA
      section_id: CORE-SEC-DNA
      order: 1
    blueprint_panel:
      source: CORE_COMPONENT_REGISTRY.yaml
      component_id: CORE-COMP-BLUEPRINT
      section_id: CORE-SEC-BLUEPRINT
      order: 2
    script_panel:
      source: CORE_COMPONENT_REGISTRY.yaml
      component_id: CORE-COMP-SCRIPT
      section_id: CORE-SEC-SCRIPT
      order: 3
    version_panel:
      source: CORE_COMPONENT_REGISTRY.yaml
      component_id: CORE-COMP-VERSION
      section_id: CORE-SEC-VERSION
      order: 4
    decision_panel:
      source: CORE_COMPONENT_REGISTRY.yaml
      component_id: CORE-COMP-DECISION
      section_id: CORE-SEC-DECISION
      order: 5

validation:
  missing_source: reject_render
  unknown_component: reject_render
  unknown_control: reject_render
  missing_shared_ai_interface_source: reject_render
  missing_core_ai_visual_extension_source: reject_render
  missing_required_shared_visual_subcomponent: reject_render
  task_context_inside_core_header: reject_render
  production_task_in_work_item_rail: reject_render
  work_item_navigation_missing: reject_render
  generic_chat_conversation_render: reject_render
