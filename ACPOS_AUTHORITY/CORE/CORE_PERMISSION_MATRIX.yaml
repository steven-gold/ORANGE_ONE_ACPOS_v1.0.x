version: CORE-PERMISSION-MATRIX-V1.1
status: AUTHORITY_ACTIVE
permissions:
  - permission_id: CORE_PROJECT_READ
    resource: CORE_PROJECT
    action: READ
    scope: PROJECT
    approval: NONE
    controls: [CORE-CTRL-PROJECT-SELECTOR]
  - permission_id: CORE_PROJECT_CREATE
    resource: CORE_PROJECT
    action: CREATE
    scope: ORGANIZATION
    approval: NONE
    controls: [CORE-CTRL-CREATE-PROJECT]
  - permission_id: CORE_TOPIC_READ
    resource: CORE_TOPIC
    action: READ
    scope: PROJECT
    approval: NONE
    controls: [CORE-CTRL-TOPIC-SELECTOR]
  - permission_id: CORE_TOPIC_CREATE
    resource: CORE_TOPIC
    action: CREATE
    scope: PROJECT
    approval: NONE
    controls: [CORE-CTRL-CREATE-TOPIC]
  - permission_id: CORE_WORK_ITEM_READ
    resource: CORE_WORK_ITEM
    action: READ
    scope: PROJECT_TOPIC
    approval: NONE
    controls: [CORE-CTRL-WORK-ITEM-SELECT]
  - permission_id: CORE_CONVERSATION_CREATE
    resource: CORE_CONVERSATION
    action: CREATE
    scope: PROJECT_TOPIC_WORK_ITEM
    approval: NONE
    controls: [CORE-CTRL-NEW-THREAD]
  - permission_id: CORE_CONVERSATION_USE
    resource: CORE_CONVERSATION
    action: USE
    scope: PROJECT_TOPIC_WORK_ITEM_THREAD
    approval: NONE
    controls: [CORE-CTRL-CONVERSATION-INPUT]
  - permission_id: CORE_DNA_CONFIRM
    resource: CORE_DNA
    action: CONFIRM
    scope: PROJECT_TOPIC
    approval: HUMAN_CONFIRMATION
    controls: [CORE-CTRL-CONFIRM-DNA]
  - permission_id: CORE_BLUEPRINT_GENERATE
    resource: CORE_BLUEPRINT
    action: GENERATE
    scope: PROJECT_TOPIC
    approval: NONE
    controls: [CORE-CTRL-GENERATE-BLUEPRINT]
  - permission_id: CORE_BLUEPRINT_LOCK
    resource: CORE_BLUEPRINT
    action: LOCK
    scope: PROJECT_TOPIC
    approval: HUMAN_CONFIRMATION
    controls: [CORE-CTRL-LOCK-BLUEPRINT]
  - permission_id: CORE_SCRIPT_GENERATE
    resource: CORE_SCRIPT
    action: GENERATE
    scope: PROJECT_TOPIC
    approval: NONE
    controls: [CORE-CTRL-GENERATE-SCRIPT]
  - permission_id: CORE_SCRIPT_CONFIRM
    resource: CORE_SCRIPT
    action: CONFIRM
    scope: PROJECT_TOPIC
    approval: HUMAN_CONFIRMATION
    controls: [CORE-CTRL-CONFIRM-SCRIPT]
  - permission_id: CORE_DECISION_CONFIRM
    resource: CORE_DECISION
    action: CONFIRM
    scope: PROJECT_TOPIC
    approval: HUMAN_CONFIRMATION
    controls: [CORE-CTRL-CONFIRM-CORE]
  - permission_id: CORE_HANDOFF_CREATE
    resource: CORE_HANDOFF
    action: CREATE
    scope: PROJECT_TOPIC
    approval: CORE_SCOPE_LOCKED
    controls: [CORE-CTRL-CREATE-PRODUCTION-TASK]

rules:
  - explicit_grant_only
  - parent_permission_does_not_imply_child_permission
  - hidden_or_disabled_when_permission_missing
  - every_action_requires_exact_permission_mapping
  - every_control_permission_id_must_exist_here
