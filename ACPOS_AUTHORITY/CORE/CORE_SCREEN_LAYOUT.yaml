version: CORE-AUTHORITY-V2
status: AUTHORITY_ACTIVE
layout_definition:
  shell_reference: ACPOS_GLOBAL_UI_SHELL_VISUAL_AUTHORITY_PURPLE_FREEZE
  page_type: AI_WORKSPACE_SINGLE_PAGE
  ratio: 16:9
  global_regions:
    header:
      fixed: true
      source: GLOBAL_UI_SHELL
    sidebar:
      fixed: true
      source: GLOBAL_UI_SHELL
  main_workspace:
    container_source: GLOBAL_WORKSPACE_001
    context_bar:
      section_id: CORE-SEC-PAGE-CONTEXT
      component_id: CORE-COMP-PAGE-CONTEXT
      position: top
      width: "100%"
      height: "64px"
    body:
      layout: three_columns
      gap: "16px"
      left:
        width: "22%"
        min_width: "260px"
        section_id: CORE-SEC-WORK-ITEM-NAV
        component_id: CORE-COMP-WORK-ITEM-NAV
        role: work_item_and_conversation_navigation
      center:
        width: "50%"
        min_width: "640px"
        section_id: CORE-SEC-CONVERSATION
        component_id: CORE-COMP-CONVERSATION
        primary: true
        role: ai_conversation_workspace
      right:
        width: "28%"
        min_width: "320px"
        role: output_state_rail
        sections:
          - section_id: CORE-SEC-DNA
            component_id: CORE-COMP-DNA
            order: 1
          - section_id: CORE-SEC-BLUEPRINT
            component_id: CORE-COMP-BLUEPRINT
            order: 2
          - section_id: CORE-SEC-SCRIPT
            component_id: CORE-COMP-SCRIPT
            order: 3
          - section_id: CORE-SEC-VERSION
            component_id: CORE-COMP-VERSION
            order: 4
          - section_id: CORE-SEC-DECISION
            component_id: CORE-COMP-DECISION
            order: 5

responsive_priority:
  preserve_center_conversation: first
  collapse_right_rail: second
  collapse_work_item_rail: third

rules:
  production_task_context:
    visible: false
    reason: production_task_created_only_after_core_lock
  work_item_nav:
    visible: true
    required: true
  page_context:
    required_controls:
      - project_selector
      - topic_selector
