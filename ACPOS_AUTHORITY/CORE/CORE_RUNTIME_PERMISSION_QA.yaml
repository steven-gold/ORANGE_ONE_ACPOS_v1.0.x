version: CORE-RUNTIME-PERMISSION-QA-V2
status: AUTHORITY_ACTIVE

runtime:
  events:
    - event_id: CORE_PROJECT_CONTEXT_CHANGED
      trigger: CORE-ACT-SELECT-PROJECT
      payload: [project_id]
      consumer: [CORE-COMP-PAGE-CONTEXT, CORE-COMP-WORK-ITEM-NAV, CORE-COMP-CONVERSATION]
      retry: none
      failure_state: project_context.ERROR

    - event_id: CORE_TOPIC_CONTEXT_CHANGED
      trigger: CORE-ACT-SELECT-TOPIC
      payload: [project_id, topic_id]
      consumer: [CORE-COMP-PAGE-CONTEXT, CORE-COMP-WORK-ITEM-NAV, CORE-COMP-CONVERSATION]
      retry: none
      failure_state: topic_context.ERROR

    - event_id: CORE_WORK_ITEM_CHANGED
      trigger: CORE-ACT-OPEN-WORK-ITEM
      payload: [project_id, topic_id, work_item_id, conversation_thread_id]
      consumer: [CORE-COMP-WORK-ITEM-NAV, CORE-COMP-CONVERSATION]
      retry: none
      failure_state: conversation.ERROR

    - event_id: CORE_DNA_CONFIRMED
      trigger: CORE-ACT-CONFIRM-DNA
      payload: [dna_version]
      consumer: [CORE-COMP-DNA, CORE-COMP-BLUEPRINT]
      retry: none
      failure_state: dna.REVIEW

    - event_id: CORE_BLUEPRINT_LOCKED
      trigger: CORE-ACT-LOCK-BLUEPRINT
      payload: [blueprint_version]
      consumer: [CORE-COMP-BLUEPRINT, CORE-COMP-SCRIPT]
      retry: none
      failure_state: blueprint.REVIEW

    - event_id: CORE_SCRIPT_CONFIRMED
      trigger: CORE-ACT-CONFIRM-SCRIPT
      payload: [script_version]
      consumer: [CORE-COMP-SCRIPT, CORE-COMP-DECISION]
      retry: none
      failure_state: script.REVIEW

    - event_id: CORE_SCOPE_LOCKED
      trigger: CORE-ACT-CONFIRM-CORE
      payload: [project_id, topic_id, locked_version_ids]
      consumer: [CORE-COMP-DECISION]
      retry: none
      failure_state: core_scope.READY_TO_LOCK

    - event_id: CORE_PRODUCTION_TASK_CREATE_REQUESTED
      trigger: CORE-ACT-CREATE-PRODUCTION-TASK
      payload: [project_id, topic_id, script_reference, blueprint_reference, dna_reference, version_reference]
      consumer: PRODUCTION_FLOW
      retry:
        max_attempts: 3
        backoff: exponential
      failure_state: production_handoff.ERROR

    - event_id: CORE_ASSET_HANDOFF_READY
      trigger: PRODUCTION_TASK_CREATE_SUCCESS
      payload: [production_task_id, project_id, topic_id]
      consumer: ASSET
      retry:
        max_attempts: 3
        backoff: exponential
      failure_state: production_handoff.ERROR

permission:
  source: CORE_PERMISSION_MATRIX.yaml
  rule:
    - all_actions_must_be_traceable
    - project_scope_required
    - topic_scope_required
    - production_task_scope_not_required_for_core_conversation

qa:
  source: CORE_QA_EVIDENCE.yaml
  required:
    - page_binding
    - section_binding
    - component_binding
    - control_binding
    - action_binding
    - state_transition_binding
    - runtime_binding
    - permission_binding
    - handoff_validation
    - source_trace
    - render_validation
    - i18n
    - test_evidence
