version: CORE-I18N-V1
status: AUTHORITY_ACTIVE
locales:
  - zh-TW
  - zh-CN
  - en

fixed_english:
  - ORANGE ONE
  - ACPOS
  - Blueprint
  - DNA

keys:
  core.project:
    zh-TW: 專案
    zh-CN: 项目
    en: Project
  core.topic:
    zh-TW: 專題
    zh-CN: 专题
    en: Topic
  core.create_project:
    zh-TW: 新增專案
    zh-CN: 新增项目
    en: New Project
  core.create_topic:
    zh-TW: 新增專題
    zh-CN: 新增专题
    en: New Topic
  core.work_items:
    zh-TW: 任務 / 對話項目
    zh-CN: 任务 / 对话项目
    en: Work Items / Conversations
  core.new_conversation:
    zh-TW: 新增對話
    zh-CN: 新增对话
    en: New Conversation
  core.conversation_input:
    zh-TW: 輸入內容
    zh-CN: 输入内容
    en: Enter message
  core.confirm_dna:
    zh-TW: 確認 DNA
    zh-CN: 确认 DNA
    en: Confirm DNA
  core.generate_blueprint:
    zh-TW: 生成 Blueprint
    zh-CN: 生成 Blueprint
    en: Generate Blueprint
  core.lock_blueprint:
    zh-TW: 鎖定 Blueprint
    zh-CN: 锁定 Blueprint
    en: Lock Blueprint
  core.generate_script:
    zh-TW: 生成腳本
    zh-CN: 生成脚本
    en: Generate Script
  core.confirm_script:
    zh-TW: 確認腳本
    zh-CN: 确认脚本
    en: Confirm Script
  core.finalize:
    zh-TW: 確認定案
    zh-CN: 确认定案
    en: Finalize

rules:
  - control_labels_must_use_i18n_key_in_implementation
  - brand_and_fixed_global_terms_must_not_be_translated
  - no_single_language_hardcoded_runtime_ui
