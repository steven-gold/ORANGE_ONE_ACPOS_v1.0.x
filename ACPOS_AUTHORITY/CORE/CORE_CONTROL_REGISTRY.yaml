version: CORE-AUTHORITY-V2
status: AUTHORITY_ACTIVE
controls:
  - id: CORE-CTRL-PROJECT-SELECTOR
    component: CORE-COMP-PAGE-CONTEXT
    section_id: CORE-SEC-PAGE-CONTEXT
    type: SELECT
    label: 專案
    action: CORE-ACT-SELECT-PROJECT
    permission: CORE_PROJECT_READ
    states: [DEFAULT, LOADING, READY, ERROR, DISABLED]

  - id: CORE-CTRL-CREATE-PROJECT
    component: CORE-COMP-PAGE-CONTEXT
    section_id: CORE-SEC-PAGE-CONTEXT
    type: BUTTON
    label: 新增專案
    action: CORE-ACT-CREATE-PROJECT
    permission: CORE_PROJECT_CREATE
    states: [DEFAULT, HOVER, LOADING, SUCCESS, ERROR, DISABLED]

  - id: CORE-CTRL-TOPIC-SELECTOR
    component: CORE-COMP-PAGE-CONTEXT
    section_id: CORE-SEC-PAGE-CONTEXT
    type: SELECT
    label: 專題
    action: CORE-ACT-SELECT-TOPIC
    permission: CORE_TOPIC_READ
    states: [DEFAULT, LOADING, READY, ERROR, DISABLED]

  - id: CORE-CTRL-CREATE-TOPIC
    component: CORE-COMP-PAGE-CONTEXT
    section_id: CORE-SEC-PAGE-CONTEXT
    type: BUTTON
    label: 新增專題
    action: CORE-ACT-CREATE-TOPIC
    permission: CORE_TOPIC_CREATE
    states: [DEFAULT, HOVER, LOADING, SUCCESS, ERROR, DISABLED]

  - id: CORE-CTRL-WORK-ITEM-SELECT
    component: CORE-COMP-WORK-ITEM-NAV
    section_id: CORE-SEC-WORK-ITEM-NAV
    type: LIST_ITEM
    label_source: work_item_title
    action: CORE-ACT-OPEN-WORK-ITEM
    permission: CORE_WORK_ITEM_READ
    states: [DEFAULT, HOVER, ACTIVE, LOCKED, DISABLED]

  - id: CORE-CTRL-NEW-THREAD
    component: CORE-COMP-WORK-ITEM-NAV
    section_id: CORE-SEC-WORK-ITEM-NAV
    type: BUTTON
    label: 新增對話
    action: CORE-ACT-CREATE-CONVERSATION-THREAD
    permission: CORE_CONVERSATION_CREATE
    states: [DEFAULT, HOVER, LOADING, SUCCESS, ERROR, DISABLED]

  - id: CORE-CTRL-CONVERSATION-INPUT
    component: CORE-COMP-CONVERSATION
    section_id: CORE-SEC-CONVERSATION
    type: TEXT_INPUT
    label: 對話輸入
    action: AI_CORE_CONVERSATION_SEND
    permission: CORE_CONVERSATION_USE
    states: [DEFAULT, FOCUSED, LOADING, DISABLED, ERROR]

  - id: CORE-CTRL-CONFIRM-DNA
    component: CORE-COMP-DNA
    section_id: CORE-SEC-DNA
    type: BUTTON
    label: 確認 DNA
    action: CORE-ACT-CONFIRM-DNA
    permission: CORE_DNA_CONFIRM
    states: [DEFAULT, HOVER, LOADING, SUCCESS, ERROR, DISABLED]

  - id: CORE-CTRL-GENERATE-BLUEPRINT
    component: CORE-COMP-BLUEPRINT
    section_id: CORE-SEC-BLUEPRINT
    type: BUTTON
    label: 生成 Blueprint
    action: CORE-ACT-GENERATE-BLUEPRINT
    permission: CORE_BLUEPRINT_GENERATE
    states: [DEFAULT, HOVER, LOADING, SUCCESS, ERROR, DISABLED]

  - id: CORE-CTRL-LOCK-BLUEPRINT
    component: CORE-COMP-BLUEPRINT
    section_id: CORE-SEC-BLUEPRINT
    type: BUTTON
    label: 鎖定 Blueprint
    action: CORE-ACT-LOCK-BLUEPRINT
    permission: CORE_BLUEPRINT_LOCK
    states: [DEFAULT, HOVER, LOADING, SUCCESS, ERROR, DISABLED]

  - id: CORE-CTRL-GENERATE-SCRIPT
    component: CORE-COMP-SCRIPT
    section_id: CORE-SEC-SCRIPT
    type: BUTTON
    label: 生成腳本
    action: CORE-ACT-GENERATE-SCRIPT
    permission: CORE_SCRIPT_GENERATE
    states: [DEFAULT, HOVER, LOADING, SUCCESS, ERROR, DISABLED]

  - id: CORE-CTRL-CONFIRM-SCRIPT
    component: CORE-COMP-SCRIPT
    section_id: CORE-SEC-SCRIPT
    type: BUTTON
    label: 確認腳本
    action: CORE-ACT-CONFIRM-SCRIPT
    permission: CORE_SCRIPT_CONFIRM
    states: [DEFAULT, HOVER, LOADING, SUCCESS, ERROR, DISABLED]

  - id: CORE-CTRL-CONFIRM-CORE
    component: CORE-COMP-DECISION
    section_id: CORE-SEC-DECISION
    type: BUTTON
    label: 確認定案
    action: CORE-ACT-CONFIRM-CORE
    permission: CORE_DECISION_CONFIRM
    states: [DEFAULT, HOVER, LOADING, SUCCESS, ERROR, DISABLED]

  - id: CORE-CTRL-CREATE-PRODUCTION-TASK
    component: CORE-COMP-DECISION
    section_id: CORE-SEC-DECISION
    type: SYSTEM_ACTION
    label: 建立後續 Production Task
    action: CORE-ACT-CREATE-PRODUCTION-TASK
    permission: CORE_HANDOFF_CREATE
    states: [HIDDEN, READY, LOADING, SUCCESS, ERROR]
    visibility: after_core_scope_locked

rules:
  - every_control_requires_component
  - every_control_requires_section
  - every_control_requires_action
  - every_control_requires_permission
  - every_control_state_must_be_registered
  - no_unknown_control
