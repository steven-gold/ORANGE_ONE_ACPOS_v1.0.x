version: CORE-AUTHORITY-V2.1
status: AUTHORITY_ACTIVE
components:
  - id: CORE-COMP-PAGE-CONTEXT
    type: PAGE_CONTEXT_SELECTOR_BAR
    purpose: select_or_create_project_and_topic_context
    binding:
      project: required
      topic: required
      production_task: forbidden

  - id: CORE-COMP-WORK-ITEM-NAV
    type: WORK_ITEM_CONVERSATION_NAVIGATION
    purpose: navigate_core_work_items_and_their_conversation_threads
    binding:
      project_id: required
      topic_id: required
      work_item_id: required_for_selection
      conversation_thread_id: required_for_open_item
    rules:
      - work_item_is_not_production_task
      - each_work_item_has_independent_conversation_history
      - switching_item_switches_conversation_thread

  - id: CORE-COMP-CONVERSATION
    type: AI_CONVERSATION_WORKSPACE
    purpose: story_dna_blueprint_script_discussion_and_revision
    authority_inheritance:
      ai_core_registry: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CORE_AUTHORITY_REGISTRY.yaml
      shared_interface: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CONVERSATION_INTERFACE_AUTHORITY.yaml
      core_visual_extension: docs/authority/CORE_AI_CONVERSATION/visual/CORE_AI_CONVERSATION_VISUAL_DESIGN_AUTHORITY.yaml
    binding:
      project: required
      topic: required
      work_item: required
      conversation_thread: required
      production_task: forbidden
    required_subcomponents:
      - AICORE-COMP-MODE-SELECTOR
      - AICORE-COMP-SINGLE-AI-WORKSPACE
      - AICORE-COMP-MULTI-AI-WORKSPACE
      - AICORE-COMP-MESSAGE-WORKSPACE
      - AICORE-COMP-RUNTIME-STATUS
      - AICORE-COMP-ASSISTANT
      - AICORE-COMP-ASSISTANT-RECORD
      - AICORE-COMP-SCORE-PANEL
      - AICORE-COMP-DECISION-PANEL
      - AICORE-COMP-INPUT-COMPOSER
      - AICORE-COMP-REPLY-CONTEXT-MENU
    rules:
      - primary_workspace
      - history_isolated_by_work_item
      - only_single_ai_and_multi_ai_modes
      - assistant_present_in_both_modes
      - score_after_summary_before_human_decision
      - page_context_controls_not_duplicated_inside_conversation
      - generic_chat_layout_forbidden

  - id: CORE-COMP-DNA
    type: DNA_PANEL
    purpose: character_object_scene_consistency_and_lock

  - id: CORE-COMP-BLUEPRINT
    type: BLUEPRINT_PANEL
    purpose: blueprint_definition_and_lock

  - id: CORE-COMP-SCRIPT
    type: SCRIPT_PANEL
    purpose: production_script_generation
    editable: revision_only
    canonical_language: chinese_internal_standard
    provider_syntax_owner: execution_layer

  - id: CORE-COMP-VERSION
    type: VERSION_PANEL
    purpose: version_tracking_and_compare

  - id: CORE-COMP-DECISION
    type: DECISION_PANEL
    purpose: human_decision_confirmation_and_lock

rules:
  component_order_right_rail:
    - CORE-COMP-DNA
    - CORE-COMP-BLUEPRINT
    - CORE-COMP-SCRIPT
    - CORE-COMP-VERSION
    - CORE-COMP-DECISION
  unknown_component: reject_render
  missing_shared_ai_core_subcomponent: reject_render
