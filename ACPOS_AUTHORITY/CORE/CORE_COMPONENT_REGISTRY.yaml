version: CORE-AUTHORITY-V1
components:
  - id: CORE-COMP-CONVERSATION
    type: AI_CONVERSATION_WORKSPACE
    purpose: story_design_blueprint_script_discussion
    binding:
      project: required
      topic: required
    notes:
      task_binding_removed: true
      reason: Production Task is created only after CORE confirmation

  - id: CORE-COMP-PROJECT-CONTEXT
    type: PROJECT_CONTEXT_PANEL
    purpose: active_project_information

  - id: CORE-COMP-TOPIC-CONTEXT
    type: TOPIC_CONTEXT_PANEL
    purpose: active_topic_information

  - id: CORE-COMP-BLUEPRINT
    type: BLUEPRINT_PANEL
    purpose: blueprint_definition_and_lock

  - id: CORE-COMP-DNA
    type: DNA_PANEL
    purpose: character_object_scene_consistency

  - id: CORE-COMP-SCRIPT
    type: SCRIPT_PANEL
    purpose: production_script_generation
    editable: revision_only

  - id: CORE-COMP-VERSION
    type: VERSION_PANEL
    purpose: version_tracking

  - id: CORE-COMP-DECISION
    type: DECISION_PANEL
    purpose: confirmation_and_handoff_decision
