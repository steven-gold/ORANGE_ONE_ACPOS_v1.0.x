  EDIT-02_and_EDIT-03_business_action_entry: forbidden
  standalone_upload_does_not_require_project_or_task: true
  provider_specific_execution_must_use_provider_adapter: true
  saved_version_overwrite: forbidden
  frontend_only_view_state_must_not_create_backend_action: true
