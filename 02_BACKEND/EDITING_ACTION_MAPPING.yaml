module: EDITING
source: R9_FINAL
active_page: EDIT-01

actions:
  - EDIT_MEDIA_IMPORT
  - EDIT_TIMELINE_UPDATE
  - EDIT_LAYER_UPDATE
  - EDIT_API_EDIT_EXECUTE
  - EDIT_SUBTITLE_SYNC
  - EDIT_QA_RECHECK
  - EDIT_VERSION_SAVE
  - EDIT_OUTPUT_RENDER

cross_service_actions_used_by_EDIT01:
  VOICE:
    - VOICE_GENERATE
    - VOICE_ASSET_BIND
    - VOICE_SYNC_EXECUTE
  ASSET:
    - ASSET_CREATE_VERSION
    - ASSET_REFERENCE_BIND
  VIDEO:
    - route_existing_video_regeneration_action_only_when_source_regeneration_required

workflow_binding: EDITING_RUNTIME_FLOW
rules:
