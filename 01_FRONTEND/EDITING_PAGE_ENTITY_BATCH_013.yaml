module: EDITING
batch: 013
source: R9_FINAL
approved_functional_extension: FULL_POST_PRODUCTION_AND_STANDALONE_EDITING

construction_rule:
  actual_function_completion_first: true
  single_active_editing_page: EDIT-01
  split_editing_pages: forbidden
  api_editing_required: true
  manual_editing_required: true
  standalone_use_without_project_task_required: true
  saved_version_overwrite: forbidden

pages:
  - id: EDIT-01
    name: Integrated Post-Production Workspace
    active_render: true
    role: complete_editing_voice_music_sfx_lipsync_subtitle_qa_output_workspace
    source_modes:
      - PROJECT_TASK
      - PROJECT_FREE_EDIT
      - STANDALONE_UPLOAD
    context_rules:
      PROJECT_TASK:
        project_id: required
        task_id: required
      PROJECT_FREE_EDIT:
        project_id: required
        task_id: optional
      STANDALONE_UPLOAD:
        project_id: optional
        task_id: forbidden
        owner_user_id: required
        upload_required_before_edit: true
    functional_zones:
      - SOURCE_AND_UPLOAD
      - PREVIEW_AND_TRANSPORT
      - MULTITRACK_TIMELINE
      - MANUAL_EDITING
      - API_EDITING
      - LAYER_MANAGEMENT
      - VOICE
      - MUSIC_AND_SFX
      - AUDIO_MIX
      - LIP_SYNC
      - SUBTITLE
      - QA_AND_CORRECTION
      - VERSION
      - FINAL_PREVIEW
      - RENDER_EXPORT_HANDOFF
    track_types:
      - VIDEO
      - VOICE
      - MUSIC
      - SFX
      - SUBTITLE
      - LIP_SYNC
      - OVERLAY
    manual_edit_operations:
      - select_clip
      - split_clip
      - trim_clip_start
      - trim_clip_end
      - move_clip
      - reorder_clip
      - delete_clip
      - duplicate_clip
      - replace_clip_source
      - set_transition
      - set_speed
      - set_clip_volume
      - set_fade_in_out
      - enable_disable_track
      - mute_unmute_track
      - solo_unsolo_track
      - lock_unlock_track
    api_edit_operations:
      - edit_full_timeline_from_instruction
      - edit_selected_range_from_instruction
      - edit_selected_clip_from_instruction
      - replace_selected_segment_by_api
      - generate_edit_candidate
      - compare_api_candidate_with_current_version
      - apply_selected_api_candidate
    integrated_service_binding:
      timeline_layer_editing: EDITING
      voice_generation: VOICE
      voice_asset_binding: VOICE
      lip_sync: VOICE
      subtitle_sync: EDITING
      asset_reference_and_version: ASSET
      source_video_regeneration_when_required: VIDEO
    version_rule:
      working_draft_may_change: true
      save_creates_new_version: true
      previous_saved_versions_remain_immutable: true

  - id: EDIT-02
    status: INTEGRATED_INTO_EDIT-01
    active_render: false
    retained_for: legacy_uid_trace_only
    integrated_zone: LAYER_MANAGEMENT|VOICE|MUSIC_AND_SFX|AUDIO_MIX|LIP_SYNC

  - id: EDIT-03
    status: INTEGRATED_INTO_EDIT-01
    active_render: false
    retained_for: legacy_uid_trace_only
    integrated_zone: SUBTITLE|QA_AND_CORRECTION|FINAL_PREVIEW|RENDER_EXPORT_HANDOFF

fields:
  - page_uid
  - source_mode
  - project_id
  - task_id
  - owner_user_id
  - timeline_id
  - working_version
  - section
  - component
  - control
  - action_binding
  - permission_binding

closure:
  frontend_definition: required
  backend_contract: required
  database_mapping: required
  runtime_flow: required
  permission_mapping: required
  qa_evidence: required
  external_provider_e2e: deployment_test_pending
