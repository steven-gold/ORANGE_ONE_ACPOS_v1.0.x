batch: 024
module: EDITING
layer: frontend
source: R9_FINAL
functional_priority: WORK_COMPLETION_OVER_DECORATIVE_LAYOUT
single_active_page: EDIT-01

pages:
  - page_uid: EDIT-01
    page_identity: Integrated Post-Production Workspace
    purpose: complete_manual_and_api_editing_voice_music_sfx_lipsync_subtitle_qa_and_output_in_one_page

    source_mode_selector:
      options:
        - PROJECT_TASK
        - PROJECT_FREE_EDIT
        - STANDALONE_UPLOAD
      default_when_project_context_exists: PROJECT_TASK
      standalone_rule: project_and_task_not_required

    sections:
      - id: EDIT01_SOURCE
        purpose: load_project_source_or_upload_media_for_independent_use
        required_components:
          - SourceModeSelector
          - ProjectTaskSourcePicker
          - MediaUploadDropzone
          - ImportQueue
          - ImportedMediaList
        upload_accepts:
          - video
          - audio
          - image
          - subtitle
        upload_behavior:
          multiple_files: true
          drag_drop: true
          file_picker: true
          create_asset_version_reference: true
          allow_standalone_owner_scope: true

      - id: EDIT01_PREVIEW
        purpose: preview_current_timeline_selected_clip_or_selected_range
        required_components:
          - PreviewViewport
          - TimecodeDisplayInput
          - TransportControls
          - PlaybackSpeed
          - RangeLoopToggle
          - Fullscreen

      - id: EDIT01_TIMELINE
        purpose: frame_accurate_multitrack_manual_editing
        required_components:
          - TimeRuler
          - Playhead
          - MultiTrackTimeline
          - CorrectionRange
          - QAMarkerRail
          - TimelineZoom
          - SnapToggle
          - TrackHeaderControls
        required_tracks:
          - VIDEO
          - VOICE
          - MUSIC
          - SFX
          - SUBTITLE
          - LIP_SYNC
          - OVERLAY

      - id: EDIT01_MANUAL_TOOLS
        purpose: directly_edit_selected_clips_tracks_and_ranges
        required_operations:
          - undo
          - redo
          - select_clip
          - split_clip
          - trim_clip_start
          - trim_clip_end
          - move_clip
          - reorder_clip
          - delete_clip
          - duplicate_clip
          - replace_clip_source
          - transition
          - speed
          - clip_volume
          - fade_in_out
          - track_enable_disable
          - track_mute_unmute
          - track_solo_unsolo
          - track_lock_unlock

      - id: EDIT01_API_EDIT
        purpose: edit_full_timeline_selected_range_or_selected_clip_through_configured_api
        required_components:
          - ApiProviderSelector
          - ApiModelSelector
          - EditInstructionComposer
          - ApiTargetScopeSelector
          - ApiEditExecute
          - ApiJobStatus
          - ApiCandidatePreview
          - ApiCandidateCompare
          - ApiCandidateApply
        target_scopes:
          - FULL_TIMELINE
          - SELECTED_RANGE
          - SELECTED_CLIP
        rule: provider_and_model_from_system_provider_registry_only

      - id: EDIT01_LAYER
        purpose: manage_layer_and_track_state_on_same_timeline
        required_components:
          - LayerList
          - TrackVisibility
          - TrackMute
          - TrackSolo
          - TrackLock
          - LayerOrder

      - id: EDIT01_VOICE
        purpose: bind_existing_voice_or_generate_voice_and_place_it_on_timeline
        required_components:
          - VoiceScriptReference
          - VoiceAssetPicker
          - VoiceProviderSelector
          - VoiceModelSelector
          - VoiceGenerate
          - VoiceTakeList
          - VoicePreview
          - VoiceABCompare
          - VoiceApplyToTimeline

      - id: EDIT01_MUSIC_SFX
        purpose: import_place_and_adjust_music_and_sound_effects
        required_components:
          - MusicAssetPicker
          - SfxAssetPicker
          - WaveformTimeline
          - ClipTimingControl
          - ClipVolumeControl
          - FadeControl

      - id: EDIT01_AUDIO_MIX
        purpose: preview_and_commit_combined_voice_music_sfx_mix
        required_components:
          - MixPreview
          - TrackLevelControl
          - MasterLevelControl
          - AudioMixExecute
          - AudioMixVersionStatus

      - id: EDIT01_LIP_SYNC
        purpose: execute_preview_and_retry_lip_sync
        required_components:
          - LipSyncTargetSelector
          - LipSyncExecute
          - LipSyncSelectedRangeRetry
          - LipSyncPreview
          - LipSyncStatus
          - LipSyncIssueMarker

      - id: EDIT01_SUBTITLE
        purpose: import_create_edit_and_sync_subtitles
        required_components:
          - SubtitleTrackList
          - SubtitleImport
          - SubtitleCreate
          - SubtitleTextEditor
          - SubtitleSplit
          - SubtitleMerge
          - SubtitleTimecodeEditor
          - SubtitleLanguageSelector
          - SubtitleFormatSelector
          - SubtitleManualSync
          - SubtitleApiSync

      - id: EDIT01_QA
        purpose: validate_and_correct_timeline_video_audio_lipsync_and_subtitle
        required_components:
          - QAStatusSummary
          - QAIssueList
          - QAMarkerJump
          - EvidenceViewer
          - CorrectionRangeLoader
          - RecheckSelectedIssue
          - RecheckFullTimeline

      - id: EDIT01_VERSION
        purpose: preserve_non_overwriting_edit_history
        required_components:
          - WorkingDraftStatus
          - SaveNewVersion
          - VersionHistory
          - VersionCompare
          - RestoreAsNewDraft

      - id: EDIT01_FINAL_PREVIEW
        purpose: review_complete_composite_before_output
        required_components:
          - FinalPreviewViewport
          - Fullscreen
          - AudioMonitor
          - SubtitleToggle
          - VersionCompare

      - id: EDIT01_OUTPUT
        purpose: render_export_and_handoff_approved_result
        required_components:
          - RenderSettings
          - FinalRender
          - RenderJobStatus
          - ExportDownload
          - SaveOutputVersion
          - Handoff

    panel_behavior:
      all_functions_same_route: true
      page_navigation_between_edit_functions: forbidden
      dense_panels_may_collapse_expand: true
      timeline_must_remain_visible_when_operating_voice_music_sfx_lipsync_or_subtitle: true
      preview_should_remain_accessible: true

    interaction_rules:
      click_time_ruler: move_playhead
      drag_playhead: scrub_preview
      previous_frame: move_minus_one_frame
      next_frame: move_plus_one_frame
      timecode_input: move_playhead_to_exact_frame
      manual_edit: update_working_draft_only
      api_edit: create_candidate_before_apply
      apply_api_candidate: update_working_draft_without_overwriting_saved_version
      save_version: create_new_immutable_version
      voice_generation: route_to_VOICE_service
      lip_sync: route_to_VOICE_sync_service
      subtitle_sync: route_to_EDITING_subtitle_service
      source_video_regeneration: route_to_VIDEO_when_regeneration_is_required

    completion_gate:
      timeline_valid: required
      audio_mix_valid: required_when_audio_present
      lip_sync_valid: required_when_lip_sync_used
      subtitle_valid: required_when_subtitle_present
      unresolved_blocking_qa_issue: forbidden

  - page_uid: EDIT-02
    active_render: false
    status: INTEGRATED_INTO_EDIT-01

  - page_uid: EDIT-03
    active_render: false
    status: INTEGRATED_INTO_EDIT-01

forbidden:
  - split_EDITING_into_multiple_active_pages
  - decorative_player_only_without_edit_operations
  - overwrite_saved_version
  - hardcode_single_external_provider
  - require_project_task_for_STANDALONE_UPLOAD
  - hide_actual_editing_functions_behind_placeholder

status: functional_contract_defined
external_render_test: pending
external_provider_e2e: pending
