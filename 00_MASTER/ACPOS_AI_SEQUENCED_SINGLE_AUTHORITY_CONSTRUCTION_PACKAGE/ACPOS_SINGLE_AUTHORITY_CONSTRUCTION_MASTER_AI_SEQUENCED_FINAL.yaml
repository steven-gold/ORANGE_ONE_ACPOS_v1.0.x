# ACPOS Single Authority Construction Master AI Sequenced Final
# R9 Authority Completion Layer
# This file is the only construction authority source.
# AI MUST NOT create parallel specifications.

version: ACPOS_v1.0.x
authority:
  type: single_source_of_truth
  precedence:
    - this_file
    - contracts
    - registries
    - implementation_layers
  forbidden:
    - duplicate_system
    - parallel_navigation
    - self_defined_business_logic

execution_sequence:
  - MASTER_AUTHORITY_READ
  - PAGE_CONTRACT_VALIDATION
  - UI_STRUCTURE_IMPLEMENTATION
  - API_BINDING
  - DATABASE_BINDING
  - RUNTIME_BINDING
  - PERMISSION_BINDING
  - QA_VALIDATION

construction_layers:
  frontend:
    source: page_registry
    required_binding:
      - page_uid
      - section_id
      - component_id
      - control_id
      - action_id

  backend:
    source: api_registry
    required_binding:
      - endpoint
      - method
      - request_schema
      - response_schema
      - error_contract

  database:
    source: database_registry
    required_binding:
      - table
      - column
      - relation
      - migration

  runtime:
    source: runtime_registry
    required_binding:
      - event_id
      - trigger
      - payload
      - consumer

  permission:
    source: permission_matrix
    required_binding:
      - resource
      - action
      - scope
      - approval

  qa:
    source: qa_matrix
    required_binding:
      - data_model
      - backend
      - runtime
      - frontend
      - state_error
      - i18n
      - test_evidence

registry_completion_rules:
  page_uid:
    target: 92
    status: authoritative_registry_required
  controls:
    target: 1141
    status: authoritative_registry_required

ai_rules:
  - read_master_before_build
  - never_invent_missing_business_rules
  - stop_when_contract_missing
  - report_blockers_before_generation
