version: 1.1.0
status: authority
project: ORANGE_ONE_ACPOS
purpose: Define L1 frontend/backend page visual authority and prevent AI freeform layout generation while inheriting the current Global Purple Shell.

visual_reference:
  base: ACPOS_AUTHORITY/00_GLOBAL_UI_SHELL/ACPOS_GLOBAL_UI_SHELL_VISUAL_AUTHORITY_PURPLE_FREEZE.md
  theme: dark_purple_technology
  principles:
    - professional enterprise AI workstation
    - high information density with clear hierarchy
    - card based interface
    - central workspace priority
    - no_standard_chat_only_layout

app_shell:
  source: 00_MASTER/UI_AUTHORITY/APP_SHELL_AUTHORITY.yaml
  logo_position: top_left
  account_position: top_right
  top_navigation: disabled
  header_height: 72px
  sidebar:
    position: left
    collapsible: true
    default_width: 240px
    collapsed_width: 72px
  main_workspace:
    priority: highest
    adaptive: true
  right_panel:
    ownership: page_specific_authority
    global_required: false

legacy_replacement:
  deep_blue_technology: replaced
  sidebar_280px: replaced
  globally_required_right_panel: replaced

rules:
  - L1 pages must directly open as functional pages.
  - Dashboard is not an intermediate menu layer.
  - Do not create additional top navigation layer.
  - Every page must define its own layout contract.
  - Visual design must connect to component, action, API, database, runtime and QA definitions.
  - L1 pages cannot override Global Header, Sidebar, Brand ratio or global purple visual identity.
