page:
  uid: L1-02_AI_WORKSPACE
  name: AI Workspace
  purpose: AI collaboration production workspace
  template: AI_WORKSPACE
  version: v2.0.2

visual_layout:
  shell: R9_APP_SHELL_v1.1
  visual_source: ACPOS_AUTHORITY/00_GLOBAL_UI_SHELL/ACPOS_GLOBAL_UI_SHELL_VISUAL_AUTHORITY_PURPLE_FREEZE.md
  header:
    logo: left
    account: right
    height: 72px
    secondary_navigation: disabled

  sidebar:
    position: left
    collapsible: true
    expanded_width: 240px
    collapsed_width: 72px
    content:
      - project_navigation
      - topic_tree
      - task_tree
      - conversation_history
      - workspace_modules

  main_workspace:
    priority: highest
    width: expanded_adaptive
    sections:
      - conversation_header
      - ai_message_workspace
      - quick_action_bar
      - input_composer

  right_panel:
    ownership: page_specific_authority
    width:
      default: 280px
      min: 260px
      max: 340px
    behavior:
      collapsible: true
      preserve_main_workspace_priority: true
    tabs:
      - blueprint
      - task_information
      - assets
      - outputs
      - qa_status

sections:
  conversation_header:
    position: top
    components:
      - workspace_title
      - status_badge
      - execution_mode
      - run_button

  ai_message_workspace:
    position: center
    purpose: display user messages AI responses system messages and structured results
    components:
      - user_message_card
      - ai_response_card
      - system_event_card
      - output_result_card

  quick_action_bar:
    position: bottom_before_input
    actions:
      - insert_blueprint
      - insert_asset
      - apply_script
      - auto_correction

  input_composer:
    position: bottom
    type: multiline_workspace_input
    components:
      - attachment_upload
      - command_template
      - submit_action

controls:
  - id: run_button
    type: action_button
    action: EXECUTE_WORKSPACE_TASK

  - id: submit_action
    type: action_button
    action: SEND_AI_REQUEST

  - id: insert_blueprint
    type: quick_action
    action: LOAD_BLUEPRINT_CONTEXT

bindings:
  ai_core_source: docs/authority/ACPOS_AI_SYSTEM_CONSTRUCTION_MASTER/AI_CORE/AI_CORE_AUTHORITY_REGISTRY.yaml
  ai_conversation_visual_source: docs/authority/CORE_AI_CONVERSATION/visual/CORE_AI_CONVERSATION_VISUAL_DESIGN_AUTHORITY.yaml
  action_flow:
    - UI
    - Action
    - API
    - Database
    - Runtime
    - QA

restrictions:
  - no_standard_chat_layout
  - no_top_secondary_navigation
  - no_global_forced_right_panel
  - no_new_undefined_features
  - no_legacy_sidebar_280px
